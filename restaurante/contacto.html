<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Antonio Del Pino Hidalgo">
    <meta name="description" content="Formulario de contacto - Restaurante El Buen Sabor">
    <meta name="keywords" content="contacto, restaurante, formulario">
    <title>Contacto - Restaurante El Buen Sabor</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body>

    <header>
        <h1>Contacto</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Volver al menú principal del restaurante</a></li>
        </ul>
    </nav>

    <main>

        <form action="#" method="post">

            <p>
                <label for="nombre_contacto">Nombre:</label>
                <input type="text" id="nombre_contacto" name="nombre_contacto">
            </p>

            <p>
                <label for="correo_contacto">Correo electrónico:</label>
                <input type="email" id="correo_contacto" name="correo_contacto">
            </p>

            <p>
                <label for="telefono_contacto">Teléfono:</label>
                <input type="tel" id="telefono_contacto" name="telefono_contacto">
            </p>

            <p>
                <label for="asunto">Asunto:</label>
                <input type="text" id="asunto" name="asunto">
            </p>

            <p>
                <label for="mensaje_contacto">Mensaje:</label><br>
                <textarea id="mensaje_contacto" name="mensaje_contacto" rows="5" cols="50"></textarea>
            </p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpiar">
            </p>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Restaurante El Buen Sabor. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
