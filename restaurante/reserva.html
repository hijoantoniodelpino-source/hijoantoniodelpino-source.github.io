<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Antonio Del Pino Hidalgo">
    <meta name="description" content="Formulario de reserva - Restaurante El Buen Sabor">
    <meta name="keywords" content="reserva, restaurante, formulario">
    <title>Reserva - Restaurante El Buen Sabor</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/recetas.css">
</head>
<body>

    <header>
        <h1>Haz una reserva</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Volver al menú principal del restaurante</a></li>
        </ul>
    </nav>

    <main>

        <form action="#" method="post">

            <p>
                <label for="nombre_reserva">Su nombre:</label>
                <input type="text" id="nombre_reserva" name="nombre_reserva">
            </p>

            <p>
                <label for="num_clientes">Número de clientes:</label>
                <input type="number" id="num_clientes" name="num_clientes" min="1">
            </p>

            <p>
                <label for="correo_reserva">Su correo electrónico:</label>
                <input type="email" id="correo_reserva" name="correo_reserva">
            </p>

            <p>
                <label for="telefono_reserva">Su teléfono:</label>
                <input type="tel" id="telefono_reserva" name="telefono_reserva">
            </p>

            <p>
                <label for="fecha_reserva">Fecha de la reserva:</label>
                <input type="date" id="fecha_reserva" name="fecha_reserva">
            </p>

            <p>
                <label for="hora_reserva">Hora de la reserva:</label>
                <input type="time" id="hora_reserva" name="hora_reserva">
            </p>

            <p>
                <label for="mensaje_reserva">Su mensaje:</label><br>
                <textarea id="mensaje_reserva" name="mensaje_reserva" rows="4" cols="50"></textarea>
            </p>

            <p>
                <input type="submit" value="Solicitar Reserva">
            </p>

        </form>

        <p>Si desea saber cómo protegemos sus datos, consulte nuestra <a href="#">Política de privacidad</a>.</p>

    </main>

    <footer>
        <p>&copy; 2026 Restaurante El Buen Sabor. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
